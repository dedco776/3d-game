<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESSENJER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --panel-bg: #111827;
            --accent-blue: #00d2ff;
            --tech-blue: #0084ff;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }

        #auth-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; background: radial-gradient(circle, #1e293b 0%, #0b0f19 100%);
        }
        .auth-card {
            background: var(--panel-bg); padding: 40px; border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.2); border: 1px solid rgba(0, 210, 255, 0.3);
            text-align: center; width: 90%; max-width: 400px;
        }
        .auth-card h1 { font-size: 32px; letter-spacing: 2px; color: var(--accent-blue); margin-bottom: 10px; font-weight: 800; }
        .auth-card p { color: var(--text-muted); margin-bottom: 25px; font-size: 14px; }
        .google-btn {
            background: linear-gradient(135deg, var(--tech-blue), var(--accent-blue));
            color: #fff; border: none; padding: 14px 20px; width: 100%; border-radius: 10px;
            font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 10px; box-shadow: 0 4px 15px rgba(0, 132, 255, 0.4); transition: 0.3s;
        }

        #app-container { display: none; height: 100vh; width: 100vw; }
        
        .sidebar {
            width: 320px; background: var(--panel-bg); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column;
        }
        .user-header {
            padding: 15px; border-bottom: 1px solid var(--border-color); display: flex;
            align-items: center; justify-content: space-between;
        }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--accent-blue); }

        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item {
            padding: 15px; display: flex; align-items: center; gap: 12px;
            cursor: pointer; background: rgba(0, 210, 255, 0.1); border-left: 4px solid var(--accent-blue);
        }

        .chat-window { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); }
        .chat-header {
            padding: 15px 20px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
        }
        .chat-header h3 { font-size: 16px; color: var(--accent-blue); }

        .messages-container {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
            background-image: radial-gradient(rgba(0, 210, 255, 0.05) 1px, transparent 0); background-size: 24px 24px;
        }

        .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
        .msg.incoming { background: var(--panel-bg); border: 1px solid var(--border-color); align-self: flex-start; }
        .msg.outgoing { background: linear-gradient(135deg, var(--tech-blue), #0056b3); align-self: flex-end; color: #fff; }

        .input-bar {
            padding: 15px 20px; background: var(--panel-bg); border-top: 1px solid var(--border-color);
            display: flex; align-items: center; gap: 12px;
        }
        .input-bar input {
            flex: 1; padding: 12px 16px; border-radius: 20px; border: 1px solid var(--border-color);
            background: #0f172a; color: #fff; outline: none; font-size: 14px;
        }
        .send-btn {
            background: var(--accent-blue); color: var(--bg-dark); border: none; width: 40px; height: 40px;
            border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .chat-window { width: 100vw; }
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h1>DESSENJER</h1>
            <p>Gmail profilingiz orqali kirasiz.</p>
            <button class="google-btn" onclick="loginWithGoogle()">
                <i class="fa-brands fa-google"></i> Google bilan kirish
            </button>
        </div>
    </div>

    <div id="app-container">
        <div class="sidebar">
            <div class="user-header">
                <div class="user-info">
                    <img id="my-avatar" class="avatar" src="" alt="Avatar">
                    <div>
                        <h4 id="my-name">...</h4>
                        <span style="font-size: 11px; color: #10b981;">● Online</span>
                    </div>
                </div>
                <i class="fa-solid fa-right-from-bracket" onclick="logout()" style="cursor:pointer; color:var(--text-muted)"></i>
            </div>
            <div class="chat-list">
                <div class="chat-item">
                    <div>
                        <h4>Global Dessenjer Chat</h4>
                        <p style="font-size: 12px; color: var(--text-muted);">Barcha foydalanuvchilar kanali</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-window">
            <div class="chat-header">
                <h3># Global Chat Room</h3>
            </div>

            <div class="messages-container" id="messagesContainer"></div>

            <div class="input-bar">
                <input type="text" id="msgInput" placeholder="Xabar yozing..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // SIZNING FIREBASE KALITLARINGIZ JOYLASHDI:
        const firebaseConfig = {
          apiKey: "AIzaSyCenUZttuxlduQAhVJVqJHH7D2ShBEcHxM",
          authDomain: "dessenger-e2981.firebaseapp.com",
          projectId: "dessenger-e2981",
          storageBucket: "dessenger-e2981.firebasestorage.app",
          messagingSenderId: "409496178722",
          appId: "1:409496178722:web:56052a223e0ffee3bc7a7b",
          measurementId: "G-J27NBYS4X7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        window.loginWithGoogle = () => {
            signInWithPopup(auth, provider).catch(err => alert(err.message));
        };

        window.logout = () => {
            signOut(auth);
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                document.getElementById('my-avatar').src = user.photoURL;
                document.getElementById('my-name').innerText = user.displayName;
                loadMessages();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('app-container').style.display = 'none';
            }
        });

        window.sendMsg = async () => {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || !currentUser) return;

            input.value = '';
            await addDoc(collection(db, "global_messages"), {
                text: text,
                uid: currentUser.uid,
                name: currentUser.displayName,
                photo: currentUser.photoURL,
                createdAt: serverTimestamp()
            });
        };

        window.handleKeyPress = (e) => {
            if (e.key === 'Enter') sendMsg();
        };

        function loadMessages() {
            const q = query(collection(db, "global_messages"), orderBy("createdAt", "asc"));
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('messagesContainer');
                container.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const isMine = data.uid === currentUser.uid;
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `msg ${isMine ? 'outgoing' : 'incoming'}`;
                    msgDiv.innerHTML = `
                        <div style="font-size: 11px; color: var(--accent-blue); font-weight: bold; margin-bottom: 2px;">${isMine ? 'Siz' : data.name}</div>
                        <div>${data.text}</div>
                    `;
                    container.appendChild(msgDiv);
                });
                container.scrollTop = container.scrollHeight;
            });
        }
    </script>
</body>
</html>
