<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Moliya Simulyatori</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #1a1a1a; }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 280px;
        }
        .stat { font-size: 18px; margin-bottom: 10px; font-weight: bold; }
        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: none;
            border-radius: 6px;
            background: #27ae60;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { background: #2ecc71; }
        .btn-risk { background: #e67e22; }
        .btn-risk:hover { background: #f39c12; }
    </style>
</head>
<body>
    <div id="ui-container">
        <div class="stat">Kapital: $<span id="balance">1000</span></div>
        <div class="stat">Aktivlar: <span id="assets">0</span> ta bino</div>
        <button class="btn" onclick="work()">Ishlash (+$100)</button>
        <button class="btn btn-risk" onclick="buyAsset()">Bino sotib olish ($500)</button>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
