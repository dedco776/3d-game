<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Web</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #fff; height: 100vh; display: flex; flex-direction: column; }
        
        /* Yuqori qism (Header) */
        .header { background: #1e293b; padding: 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
        .header h2 { font-size: 18px; color: #38bdf8; }
        
        /* Xabarlar yoziladigan joy */
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #334155; padding: 10px 15px; border-radius: 10px; max-width: 75%; word-break: break-word; }
        .my-message { background: #2563eb; align-self: flex-end; }

        /* Pastki yozish paneli */
        .input-box { background: #1e293b; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #334155; }
        .input-box input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #0f172a; color: #fff; outline: none; font-size: 16px; }
        .input-box button { background: #38bdf8; color: #0f172a; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Telegram Web Chat</h2>
        <span id="status" style="font-size: 12px; color: #10b981;">● Online</span>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message">Salom! Xush kelibsiz. Bu yerga yozib koʻring.</div>
    </div>

    <div class="input-box">
        <input type="text" id="messageInput" placeholder="Xabar yozing...">
        <button onclick="sendMessage()">Yuborish</button>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');

        function sendMessage() {
            let text = messageInput.value.trim();
            if (text === "") return;

            // Biz yozgan xabar
            let msgDiv = document.createElement('div');
            msgDiv.className = 'message my-message';
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);

            messageInput.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Enter tugmasini bosganda ham yuborish
        messageInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
