<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESSENJER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS kutubxonasi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --panel-bg: #111827;
            --accent-blue: #00d2ff;
            --tech-blue: #0084ff;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }

        .lang-switch { position: absolute; top: 15px; right: 15px; display: flex; gap: 8px; z-index: 10; }
        .lang-btn {
            background: var(--panel-bg); color: var(--text-muted); border: 1px solid var(--border-color);
            padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;
        }
        .lang-btn.active { color: var(--accent-blue); border-color: var(--accent-blue); }

        #auth-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; background: radial-gradient(circle, #1e293b 0%, #0b0f19 100%); position: relative;
        }
        .auth-card {
            background: var(--panel-bg); padding: 40px; border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.2); border: 1px solid rgba(0, 210, 255, 0.3);
            text-align: center; width: 90%; max-width: 400px;
        }
        .auth-card h1 { font-size: 32px; letter-spacing: 2px; color: var(--accent-blue); margin-bottom: 10px; font-weight: 800; }
        .auth-card p { color: var(--text-muted); margin-bottom: 25px; font-size: 14px; }
        .google-btn {
            background: linear-gradient(135deg, var(--tech-blue), var(--accent-blue));
            color: #fff; border: none; padding: 14px 20px; width: 100%; border-radius: 10px;
            font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 10px; box-shadow: 0 4px 15px rgba(0, 132, 255, 0.4); transition: 0.3s;
        }

        #app-container { display: none; height: 100vh; width: 100vw; display: none; }
        
        .sidebar {
            width: 320px; background: var(--panel-bg); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column;
        }
        .user-header {
            padding: 15px; border-bottom: 1px solid var(--border-color); display: flex;
            align-items: center; justify-content: space-between;
        }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--accent-blue); object-fit: cover; }

        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item {
            padding: 15px; display: flex; align-items: center; gap: 12px;
            cursor: pointer; background: rgba(0, 210, 255, 0.1); border-left: 4px solid var(--accent-blue);
        }

        .chat-window { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); }
        .chat-header {
            padding: 15px 20px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
        }
        .chat-header h3 { font-size: 16px; color: var(--accent-blue); }

        .messages-container {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
            background-image: radial-gradient(rgba(0, 210, 255, 0.05) 1px, transparent 0); background-size: 24px 24px;
        }

        .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .msg.incoming { background: var(--panel-bg); border: 1px solid var(--border-color); align-self: flex-start; }
        .msg.outgoing { background: linear-gradient(135deg, var(--tech-blue), #0056b3); align-self: flex-end; color: #fff; }

        .input-bar {
            padding: 15px 20px; background: var(--panel-bg); border-top: 1px solid var(--border-color);
            display: flex; align-items: center; gap: 12px;
        }
        .input-bar input {
            flex: 1; padding: 12px 16px; border-radius: 20px; border: 1px solid var(--border-color);
            background: #0f172a; color: #fff; outline: none; font-size: 14px;
        }
        .send-btn {
            background: var(--accent-blue); color: var(--bg-dark); border: none; width: 40px; height: 40px;
            border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .chat-window { width: 100vw; }
        }
    </style>
</head>
<body>

    <div class="lang-switch">
        <button class="lang-btn active" onclick="setLanguage('uz')">UZ</button>
        <button class="lang-btn" onclick="setLanguage('ru')">RU</button>
        <button class="lang-btn" onclick="setLanguage('en')">EN</button>
    </div>

    <div id="auth-screen">
        <div class="auth-card">
            <h1>DESSENJER</h1>
            <p id="t-subtitle">Gmail profilingiz orqali kirasiz.</p>
            <button class="google-btn" onclick="loginWithGoogle()">
                <i class="fa-brands fa-google"></i> <span id="t-loginbtn">Google bilan kirish</span>
            </button>
        </div>
    </div>

    <div id="app-container" style="display: none;">
        <div class="sidebar">
            <div class="user-header">
                <div class="user-info">
                    <img id="my-avatar" class="avatar" src="" alt="Avatar">
                    <div>
                        <h4 id="my-name" style="font-size: 14px;">...</h4>
                        <span style="font-size: 11px; color: #10b981;">● Online</span>
                    </div>
                </div>
                <i class="fa-solid fa-right-from-bracket" onclick="logout()" style="cursor:pointer; color:var(--text-muted)"></i>
            </div>
            <div class="chat-list">
                <div class="chat-item">
                    <div>
                        <h4 id="t-globalchat">Global Dessenjer Chat</h4>
                        <p id="t-channeldesc" style="font-size: 12px; color: var(--text-muted);">Barcha foydalanuvchilar kanali</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-window">
            <div class="chat-header">
                <h3 id="t-roomheader"># Global Chat Room</h3>
            </div>

            <div class="messages-container" id="messagesContainer"></div>

            <div class="input-bar">
                <input type="text" id="msgInput" placeholder="Xabar yozing..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        // SUPABASE SOZLAMALARI (O'zingizning Supabase kalitlaringizni shu yerga yozing)
        const SUPABASE_URL = 'https://akascjltrlhildcrxkqn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrYXNjamx0cmxoaWxkY3J4a3FuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MjE0MDMsImV4cCI6MjEwMzE5NzQwM30.sMOGy7hNOpGpIAVvgAtAdTbowOxMJJHV5Xvk8tEZ7kg';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        async function checkUser() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                showApp(currentUser);
            } else {
                showAuth();
            }
        }

        checkUser();

        async function loginWithGoogle() {
            const { error } = await _supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin
                }
            });
            if (error) alert(error.message);
        }

        async function logout() {
            await _supabase.auth.signOut();
            window.location.reload();
        }

        function showAuth() {
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('app-container').style.display = 'none';
        }

        function showApp(user) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            
            const meta = user.user_metadata;
            document.getElementById('my-avatar').src = meta.avatar_url || meta.picture;
            document.getElementById('my-name').innerText = meta.full_name || meta.name;
            loadMessages();
        }

        async function sendMsg() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || !currentUser) return;

            const meta = currentUser.user_metadata;
            const name = meta.full_name || meta.name;

            await _supabase.from('messages').insert([
                { text: text, user_name: name, user_id: currentUser.id }
            ]);
            input.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMsg();
        }

        async function loadMessages() {
            const container = document.getElementById('messagesContainer');
            
            // Dastlabki xabarlarni olish
            const { data: messages } = await _supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true });

            renderMessages(messages || []);

            // Realtime yangilanishni yoqish
            _supabase
                .channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    messages.push(payload.new);
                    renderMessages(messages);
                })
                .subscribe();
        }

        function renderMessages(messages) {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            messages.forEach((msg) => {
                const isMine = msg.user_id === currentUser.id;
                const msgDiv = document.createElement('div');
                msgDiv.className = `msg ${isMine ? 'outgoing' : 'incoming'}`;
                msgDiv.innerHTML = `
                    <div style="font-size: 11px; color: var(--accent-blue); font-weight: bold; margin-bottom: 2px;">${isMine ? 'Siz' : msg.user_name}</div>
                    <div>${msg.escapeHtml ? msg.text : escapeHtml(msg.text)}</div>
                `;
                container.appendChild(msgDiv);
            });
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Multilanguage
        const translations = {
            uz: {
                subtitle: "Gmail profilingiz orqali kirasiz.",
                loginbtn: "Google bilan kirish",
                globalchat: "Global Dessenjer Chat",
                channeldesc: "Barcha foydalanuvchilar kanali",
                roomheader: "# Global Chat Room",
                placeholder: "Xabar yozing..."
            },
            ru: {
                subtitle: "Вход через ваш профиль Gmail.",
                loginbtn: "Войти через Google",
                globalchat: "Глобальный Dessenjer Чат",
                channeldesc: "Канал для всех пользователей",
                roomheader: "# Глобальный Чат",
                placeholder: "Напишите сообщение..."
            },
            en: {
                subtitle: "Sign in using your Gmail profile.",
                loginbtn: "Sign in with Google",
                globalchat: "Global Dessenjer Chat",
                channeldesc: "Channel for all users",
                roomheader: "# Global Chat Room",
                placeholder: "Type a message..."
            }
        };

        window.setLanguage = (lang) => {
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const t = translations[lang];
            document.getElementById('t-subtitle').innerText = t.subtitle;
            document.getElementById('t-loginbtn').innerText = t.loginbtn;
            document.getElementById('t-globalchat').innerText = t.globalchat;
            document.getElementById('t-channeldesc').innerText = t.channeldesc;
            document.getElementById('t-roomheader').innerText = t.roomheader;
            document.getElementById('msgInput').placeholder = t.placeholder;
        };
    </script>
</body>
</html>
